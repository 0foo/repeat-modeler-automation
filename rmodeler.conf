# rmodeler.conf -- the ONLY way to configure worker.sh and rm-manager.sh.
#
# Copy this file to rmodeler.conf, in the same directory as worker.sh and
# rm-manager.sh, and edit the values. Both scripts require it: they exit 2 if
# the file is missing, if any setting below is missing from it, if a setting
# name is misspelled, or if a value is nonsense.
#
# There are no command-line options and no environment overrides -- values
# inherited from the environment are discarded before this file is read, so
# `THREADS=2 ./worker.sh` does nothing. Workers sharing a STATE_DIR must all
# agree on where everything is; one mandatory file guarantees they do.
#
# Format: plain KEY=value, one per line. Quotes around the value are optional.
# '#' starts a comment. This file is read, not sourced -- it cannot run shell
# commands. Every setting listed here must be present, even if you leave the
# value empty (MEM_LIMIT).
#
# The values below are a reasonable starting point for a 24-core / 124 GB box.

#--- paths --------------------------------------------------------------------
# IN_DIR must exist. WORK_DIR and STATE_DIR must be on a local filesystem,
# NOT NFS: claims rely on mkdir being atomic. WORK_DIR runs 20-80 GB per
# genome in flight, so put it somewhere big and fast.
IN_DIR=/data/genomes/1_masked_datasets/genomes_dhakad
WORK_DIR=/data/rmodeler/scratch/rmodeler/work
OUT_DIR=/data/rmodeler/out
STATE_DIR=/data/rmodeler/state
LOG_DIR=/data/rmodeler/logs

# Where rm-manager.sh keeps one pid file per worker slot.
RUN_DIR=/data/rmodeler/state/run

#--- container ----------------------------------------------------------------
RM_IMAGE=dfam/tetools:latest
DOCKER=docker                 # "sudo docker" or "podman" also work

#--- sizing -------------------------------------------------------------------
WORKERS=2                     # how many workers `./rm-manager.sh start` launches
THREADS=2                     # cores per genome; also the container --cpus cap
MEM_LIMIT=                    # e.g. 28g. Empty = unlimited. A cgroup OOM kill
                              # looks like an ordinary failure in the log, so
                              # check dmesg before believing one

#--- RepeatModeler ------------------------------------------------------------
GLOB=*.fna.gz                 # which files in IN_DIR count as input
LTRSTRUCT=0                   # 1 = add -LTRStruct; roughly doubles wall time
                              # and disk. Only if you want the LTR pipeline

#--- behaviour ----------------------------------------------------------------
KEEP_WORK=0                   # 1 = keep the RM_* rounds dirs on success
RETRY_FAILED=0                # 1 = re-attempt samples marked failed
STOP_GRACE=10                 # seconds docker waits before SIGKILLing a
                              # container on shutdown
